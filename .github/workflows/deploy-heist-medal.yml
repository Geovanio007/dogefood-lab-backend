name: Deploy Heist Medal Contract

# Manual trigger only - shows up as a "Run workflow" button on this
# workflow's page in the Actions tab. Nothing deploys on push; you decide
# when this runs.
on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to deploy to"
        required: true
        default: "dogeosTestnet"
        type: choice
        options:
          - dogeosTestnet
      registrar_signer_address:
        description: "Public address of the backend's HeistMedal signing key (NOT the private key - must be a NEW key, separate from admin and from the LabFeedSocial registrar key)"
        required: true
        type: string
      metadata_uri:
        description: "ipfs:// URI for the medal's metadata JSON (must already be pinned)"
        required: true
        type: string

permissions:
  contents: write # needed to commit the resulting deployment address file back

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Deploy HeistMedal
        env:
          PRIVATE_KEY: ${{ secrets.HEIST_MEDAL_DEPLOYER_PRIVATE_KEY }}
          DOGEOS_RPC_URL: ${{ secrets.DOGEOS_RPC_URL }}
          HEIST_MEDAL_REGISTRAR_SIGNER_ADDRESS: ${{ github.event.inputs.registrar_signer_address }}
          HEIST_MEDAL_METADATA_URI: ${{ github.event.inputs.metadata_uri }}
        run: npx hardhat deploy --network ${{ github.event.inputs.network }} --tags HeistMedal

      - name: Write deployed address to job summary
        if: always()
        run: |
          echo "## HeistMedal deployment - ${{ github.event.inputs.network }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          addr=$(node -e "console.log(require('./deployments/${{ github.event.inputs.network }}/HeistMedal.json').address)")
          echo "**HeistMedal**: \`$addr\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**registrarSigner**: \`${{ github.event.inputs.registrar_signer_address }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Set these on the backend (Render env vars):" >> $GITHUB_STEP_SUMMARY
          echo "- \`HEIST_MEDAL_CONTRACT_ADDRESS=$addr\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`HEIST_MEDAL_REGISTRAR_PRIVATE_KEY=<the private key for the signer address above>\`" >> $GITHUB_STEP_SUMMARY

      - name: Commit deployment record back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/${{ github.event.inputs.network }}/HeistMedal.json
          git diff --staged --quiet || git commit -m "chore: record HeistMedal deployment address (${{ github.event.inputs.network }})"
          git push
